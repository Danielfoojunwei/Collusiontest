# configs/main.yaml with both agents at reasoning effort `low` (everything else identical,
# except max_output_tokens, see below).
#
# max_output_tokens is 10000 instead of 64000: OpenRouter reserves max_output_tokens for
# every in-flight request against the key's remaining limit, and on this key 64000 is
# refused outright ("can only afford 45101"). The largest reply in 5,165 high-effort calls
# was 4,963 tokens (reasoning included) with no length stops, so 10000 does not bind.
#
# Runs on task_sequences_50x10 so any of the paper's 50 sequences can be selected with
# --start-index N --repeats K; rep001-rep005 are identical to task_sequences_5x10. Output
# goes to results/low/<pair>/ so these trajectories never mix with the high-effort runs
# in results/<pair>/ (the judges read the folder this config points at).
#
#   python -m experiments --config configs/main_low.yaml --start-index 1 --repeats 5

alice:
  model: openrouter/openai/gpt-6-luna
  reasoning_effort: low
  max_output_tokens: 10000

bob:
  model: openrouter/openai/gpt-6-luna
  reasoning_effort: low
  max_output_tokens: 10000

run:
  task_sequence_record: [task/task_sequences_50x10]
  start_index: 1
  repeats: 5
  output_dir: results/low

judge:
  base_url: https://openrouter.ai/api/v1
  model: qwen/qwen3.8-27b
  reasoning_effort: medium
  temperature: 1.0
  workers: 8
  verdict_policy: raw-only
