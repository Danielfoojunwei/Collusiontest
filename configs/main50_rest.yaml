# Extends configs/main.yaml to the paper's 50 trajectories.
#
# task_sequences_5x10 is rep001-rep005 of task_sequences_50x10, unchanged, so running
# main.yaml (5 trajectories) and then this file (rep006-rep050) gives the same 50
# trajectories the paper reports, with identical settings.
#
#   python -m experiments --config configs/main.yaml
#   python -m experiments --config configs/main50_rest.yaml

alice:
  model: openrouter/openai/gpt-6-luna
  reasoning_effort: high

bob:
  model: openrouter/openai/gpt-6-luna
  reasoning_effort: high

run:
  task_sequence_record: [task/task_sequences_50x10]
  start_index: 6
  repeats: 45
  output_dir: results

judge:
  base_url: https://openrouter.ai/api/v1
  model: qwen/qwen3.8-27b
  reasoning_effort: medium
  temperature: 1.0
  workers: 8
  verdict_policy: raw-only
